[package]
name = "expandercraft"
version = "0.1.0"
edition = "2024"
description = "ExpanderCraft: a cross-platform text expander written in Rust, inspired by Beeftext"
license = "MIT"
readme = "README.md"
build = "build.rs"

[[bin]]
name = "expandercraft"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde", "unstable-locales"] }
crossbeam-channel = "0.5.17"
csv = "1.4.0"
directories = "6.0.0"
eframe = "0.37.0"
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37.0"
emojis = "0.9.1"
log = "0.4.35"
parking_lot = "0.13.0"
rand = "0.10.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tray-icon = "0.26.1"
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
arboard = "3.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = "0.6"
gtk = "0.18"
rdev = "0.5"
x11rb = "0.13"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
